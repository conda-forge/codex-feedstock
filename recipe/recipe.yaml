context:
  version: "0.159.3"

package:
  name: codex
  version: ${{ version }}

source:
  url: https://github.com/openai/codex/archive/refs/tags/rust-v${{ version }}.tar.gz
  sha256: 7a13f939c8b5ea4e5fb1434f0b4a5ea3f4c85b22a4782818cb28a43ed0deac58
  patches:
    - patches/0001-chatgpt-recursion-limit.patch

build:
  number: 1
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    file: build

requirements:
  build:
    - python >=3.11
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - just
    - if: linux
      then: pkg-config
    - if: win
      then: m2-sed
  host:
    - if: unix
      then:
        - ripgrep
    - if: linux
      then:
        - openssl <4.0a0
        - libcap
  run:
    - if: unix
      then: ripgrep

tests:
  - script:
      - codex --version
  - package_contents:
      bin:
        - codex
        - codex-code-mode-host
      files:
        - etc/pixi/codex/global-ignore-conda-prefix
        - if: unix
          then:
            - codex-path/rg
            - share/zsh/site-functions/_codex
            - share/bash-completion/completions/codex
            - share/fish/vendor_completions.d/codex.fish

about:
  summary: Lightweight coding agent that runs in your terminal
  homepage: https://github.com/openai/codex
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/openai/codex

extra:
  recipe-maintainers:
    - moritzwilksch
    - zelosleone
    - Hofer-Julian
    - pavelzw
    - timkpaine
