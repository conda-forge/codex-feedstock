context:
  version: "0.157.0"

package:
  name: codex
  version: ${{ version }}

source:
  url: https://github.com/openai/codex/archive/refs/tags/rust-v${{ version }}.tar.gz
  sha256: 10d6b3d485440b6b92d46e20398a940f756bb12a6a98a1daa1932df05937eab7

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    file: build

requirements:
  build:
    - python >=3.11
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - just
    - if: linux
      then: pkg-config
    - if: win
      then: m2-sed
  host:
    - if: linux
      then:
        - openssl <4.0a0
        - libcap

tests:
  - script:
      - codex --version
  - package_contents:
      bin:
        - codex
        - codex-code-mode-host
      files:
        - etc/pixi/codex/global-ignore-conda-prefix
        - if: unix
          then:
            - share/zsh/site-functions/_codex
            - share/bash-completion/completions/codex
            - share/fish/vendor_completions.d/codex.fish

about:
  summary: Lightweight coding agent that runs in your terminal
  homepage: https://github.com/openai/codex
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/openai/codex

extra:
  recipe-maintainers:
    - moritzwilksch
    - zelosleone
    - Hofer-Julian
    - pavelzw
