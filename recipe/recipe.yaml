context:
  version: "0.167.1"

package:
  name: codex
  version: ${{ version }}

source:
  url: https://github.com/openai/codex/archive/refs/tags/rust-v${{ version }}.tar.gz
  sha256: c1c35ded9cf1b77532d6d5a8e970e47f544481f074f21a0def7779b02fc1e799
  patches:
    - patches/0001-Set-recursion_limit-to-256-in-codex-chatgpt.patch

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      # libgit2's SecureTransport backend keeps dropping the connection to
      # chromium.googlesource.com (rusty_v8 submodules) on macOS; use the git CLI
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    file: build

requirements:
  build:
    - python >=3.11
    - ${{ compiler('rust') }}
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - just
    - git
    - if: linux
      then: pkgconf
    - if: win
      then: m2-sed
  host:
    - if: unix
      then:
        - ripgrep
    - if: linux
      then:
        - openssl <4.0a0
        - libcap
  run:
    - if: unix
      then: ripgrep

tests:
  - script:
      - codex --version
  - package_contents:
      bin:
        - codex
        - codex-code-mode-host
      files:
        - etc/pixi/codex/global-ignore-conda-prefix
        - if: unix
          then:
            - codex-path/rg
            - share/zsh/site-functions/_codex
            - share/bash-completion/completions/codex
            - share/fish/vendor_completions.d/codex.fish

about:
  summary: Lightweight coding agent that runs in your terminal
  homepage: https://github.com/openai/codex
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  repository: https://github.com/openai/codex

extra:
  recipe-maintainers:
    - moritzwilksch
    - zelosleone
    - Hofer-Julian
    - pavelzw
